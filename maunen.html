<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Màu nền và Ảnh nền</title>
    <!-- Liên kết tới tệp style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn mô tả -->
    <p class="description">
        Trang web này được thiết kế để thực hành cách áp dụng màu nền (background-color) và hình ảnh nền (background-image) trong CSS.
    </p>

    <!-- Khối div chứa nội dung quan trọng có ảnh nền -->
    <div class="important-box">
        <h2>Nội Dung Quan Trọng</h2>
        <p>Khối này sử dụng ảnh nền kết hợp căn giữa nội dung và tạo độ tương phản giúp người dùng dễ đọc.</p>
    </div>

</body>
</html>
